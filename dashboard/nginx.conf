map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /graphql {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /billing/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/chat {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/chat;
        # The API has a 110s overall deadline; preserve its structured timeout
        # response while staying below the outer proxy's request budget.
        proxy_read_timeout 115s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
